<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Foundation Admin Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/login.css">

</head>

<body>

    <div class="overlay">

        <div class="login-card shadow-lg">

            <div class="text-center mb-4">

                <h2>Purbiya Foundation Admin</h2>

                <p>Welcome Back</p>

            </div>

            <form>

                <div class="mb-3">

                    <label>Email</label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-envelope"></i>

                        </span>

                        <input type="email" id="email" class="form-control" placeholder="Enter Email">

                    </div>

                </div>

                <div class="mb-3">

                    <label>Password</label>

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-lock"></i>

                        </span>

                            <input type="password" id="password" class="form-control" id="password"
                                placeholder="Enter Password">

                            <button class="btn btn-light add" type="button" id="togglePassword">

                                <i class="bi bi-eye"></i>

                            </button>
                    </div>

                </div>

                <div class="d-flex justify-content-between mb-3">

                    <div>

                        <input type="checkbox">

                        Remember Me

                    </div>

                    <a href="#" class="orange">Forgot Password?</a>

                </div>

                <a href="/dashboard.html" class="text-decoration-none">
                    <button class="btn login-btn w-100">
                        Login

                    </button>
                </a>

            </form>

            <div class="footer">

                © 2026 Foundation Management System

            </div>

        </div>

    </div>

    <script src="/js/login.js"></script>
</body>

</html>
