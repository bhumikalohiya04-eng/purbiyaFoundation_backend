<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Blog Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/blog.css">

</head>

<body>
    <div>    
        <div id="sidebar-container"></div>
    </div>

   <div class="main-content">
    <div class="container-fluid py-4">

        <div class="container-fluid">

                <div class="card shadow-lg border-0">

                    <div class="card-header text-white">

                        <h4>

                            <i class="bi bi-journal-richtext"></i>

                            Blog Management

                        </h4>

                    </div>

                    <div class="card-body">

                        <form id="blogForm" method="POST" enctype="multipart/form-data">

                            <div class="row">

                                <div class="col-md-4">

                                    <label class="form-label">

                                        Blog Image

                                    </label>

                                    <input type="file" class="form-control" id="image" name="image" accept="image/*">

                                    <img id="preview" class="img-fluid rounded mt-3">

                                </div>

                                <div class="col-md-8">

                                    <div class="mb-3">

                                        <label class="form-label">

                                            Title

                                        </label>

                                        <input type="text" class="form-control" id="title"
                                            placeholder="Enter Blog Title">

                                    </div>

                                    <div class="row">

                                        <div class="col-md-6">

                                            <label class="form-label">

                                                Category

                                            </label>

                                            <select id="category" class="form-select">

                                                <option value="1">Education</option>
                                                <option value="2">Temple</option>
                                                <option value="3">Donation</option>
                                                <option value="4">Women Empowerment</option>

                                            </select>
                                        </div>

                                        <div class="col-md-6">

                                            <label class="form-label">

                                                Date

                                            </label>

                                            <input type="date" id="blog_date" class="form-control">

                                        </div>

                                    </div>

                                    <div class="mt-3">

                                        <label class="form-label">

                                            Description

                                        </label>

                                        <textarea id="description" rows="6" class="form-control">

                                </textarea>

                                    </div>

                                    <div class="row mt-3">

                                        <div class="col-md-6">

                                            <label class="form-label">

                                                Status

                                            </label>

                                            <select id="status" class="form-select">

                                                <option>

                                                    Published

                                                </option>

                                                <option>

                                                    Draft

                                                </option>

                                            </select>

                                        </div>

                                        <div class="col-md-6 d-flex align-items-center">

                                            <div class="form-check mt-4">

                                                <input type="checkbox" id="featured" class="form-check-input">

                                                <label class="form-label">

                                                    Featured Blog

                                                </label>

                                            </div>

                                        </div>

                                    </div>

                                    <div class="mt-4">

                                        <button type="submit" class="btn blue">

                                            <i class="bi bi-check-circle"></i>

                                            Save Blog

                                        </button>

                                        <button type="reset" class="btn btn-warning">

                                            Reset

                                        </button>

                                    </div>

                                </div>

                            </div>

                        </form>

                    </div>

                </div>

                <!-- Blog Table -->

                <div class="card shadow mt-5">

                    <div class="card-header">

                        <h4>

                            Manage Blogs

                        </h4>

                    </div>

                    <div class="card-body">

                        <div class="row mb-3">

                            <div class="col-md-3">

                                <select class="form-select">

                                    <option>

                                        10 Entries

                                    </option>

                                    <option>

                                        25 Entries

                                    </option>

                                    <option>

                                        50 Entries

                                    </option>

                                </select>

                            </div>

                            <div class="col-md-3 ms-auto">

                                <input class="form-control" id="searchBlog" placeholder="Search Blog">

                            </div>

                        </div>

                        <div class="table-responsive">

                            <table class="table table-hover align-middle">

                                <thead class="bg-primary">

                                    <tr>

                                        <th>No.</th>

                                        <th>Image</th>

                                        <th>Title</th>

                                        <th>Category</th>

                                        <th>Date</th>

                                        <th>Status</th>

                                        <th>Actions</th>

                                    </tr>

                                </thead>

                                <tbody id="blogTable">

                                    <tr>

                                        <td>

                                            1

                                        </td>

                                        <td>

                                            <img src="/uploads/sample.jpg" class="blog-img">

                                        </td>

                                        <td>

                                            Temple Event

                                        </td>

                                        <td>

                                            Temple

                                        </td>

                                        <td>

                                            19 Jul 2026

                                        </td>

                                        <td>

                                            <span class="badge bg-success">

                                                Published

                                            </span>

                                        </td>

                                        <td>

                                            <button class="btn btn-warning btn-sm" onclick=`editBlog(${blog.id})`>

                                                <i class="bi bi-pencil"></i>

                                            </button>

                                            <button class="btn btn-danger btn-sm">

                                                <i class="bi bi-trash"></i>

                                            </button>

                                        </td>

                                    </tr>

                                </tbody>
                                <div id="pagination"></div>
                            </table>

                        </div>

                    </div>

                </div>

            </div>
        </div>
    </div>
</div>

    <script src="/js/blog.js"></script>
    <script src="/components/sidebar.js"></script>

</body>

</html>
