<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Foundation Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/dashboard.css">

</head>

<body>
   <div id="sidebar-container"></div>
     <!-- <div class="wrapper">  -->

                <div class="container-fluid d-flex float-start">
                    <main class="content">

                        <!-- Navbar -->

                        <nav class="navbar navbar-expand bg-white shadow-sm rounded mb-4 px-4">

                            <div class="container-fluid">

                                <h3 class="m-0">

                                    Dashboard

                                </h3>

                                <div class="d-flex align-items-center">

                                    <i class="bi bi-bell fs-4 me-4 position-relative">

                                        <span class="badge bg-danger rounded-pill notification width-auto">

                                            3

                                        </span>

                                    </i>

                                    <img src="./assest/avtar.jpg" class="top-profile" width="80px">

                                </div>

                            </div>

                        </nav>

                        <!-- Cards -->

                        <div class="row g-4">

                            <div class="col-lg-3">

                                <div class="card stat-card">

                                    <div class="card-body">

                                        <i class="bi bi-journal-richtext display-6"></i>

                                        <h4>15</h4>

                                        <p>Total Blogs</p>

                                    </div>

                                </div>

                            </div>

                            <div class="col-lg-3">

                                <div class="card stat-card">

                                    <div class="card-body">

                                        <i class="bi bi-images display-6"></i>

                                        <h4>24</h4>

                                        <p>Gallery Images</p>

                                    </div>

                                </div>

                            </div>

                            <div class="col-lg-3">

                                <div class="card stat-card">

                                    <div class="card-body">

                                        <i class="bi bi-calendar-event display-6"></i>

                                        <h4>9</h4>

                                        <p>Upcoming Events</p>

                                    </div>

                                </div>

                            </div>

                            <div class="col-lg-3">

                                <div class="card stat-card">

                                    <div class="card-body">

                                        <i class="bi bi-heart-fill display-6"></i>

                                        <h4>₹2.5L</h4>
                                        <p>Total Donations</p>

                                    </div>

                                </div>

                            </div>

                        </div>

                        <!-- Profile -->

                        <div class="card mt-4">

                            <div class="card-header">

                                Administrator Profile

                            </div>

                            <div class="card-body">

                                <div class="row">

                                    <div class="col-md-4 text-center">

                                        <img src="assest/avtar.jpg"
                                            width="140" class="rounded-circle">

                                    </div>

                                    <div class="col-md-8">

                                        <table class="table">

                                            <tr>
                                                <th>Name</th>
                                                <td>Admin</td>
                                            </tr>

                                            <tr>
                                                <th>Email</th>
                                                <td>admin@gmail.com</td>
                                            </tr>

                                            <tr>

                                                <th>Mobile</th>
                                                <td>+91 9416032072</td>

                                            </tr>

                                        </table>

                                    </div>

                                </div>

                            </div>

                        </div>

                        <!-- Recent Activities -->

                        <div class="card mt-4">

                            <div class="card-header">

                                Recent Activities

                            </div>

                            <div class="card-body">

                                <ul class="list-group">

                                    <li class="list-group-item">

                                        New blog added.

                                    </li>

                                    <li class="list-group-item">

                                        Gallery updated.

                                    </li>

                                    <li class="list-group-item">

                                        Donation received.

                                    </li>

                                    <li class="list-group-item">

                                        Event created.

                                    </li>

                                </ul>

                            </div>

                        </div>

                    </main>

                </div>
             </div>
             </div> 
         </div>
     </div> 
    <script src="../public/js/dashboard.js"></script>
    <script src="./components/sidebar.js"></script>

</body>

</html>
