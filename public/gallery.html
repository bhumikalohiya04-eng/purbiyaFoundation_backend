<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery Master</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/gallery.css">

</head>

<body>
    <div id="sidebar-container"></div>
    <div class="container py-4">

        <!-- Upload Card -->

        <div class="card shadow-lg border-0 rounded-4 mb-4">

            <div class="card-header">

                <h5 class="mb-0">

                    <i class="bi bi-cloud-upload"></i>

                    Manage Gallery

                </h5>

            </div>

            <div class="card-body">

                <form id="galleryForm" action="/gallery/add" method="POST" enctype="multipart/form-data">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                File Type

                            </label>

                            <select class="form-select" name="fileType" required>

                                <option value="">

                                    Select File Type

                                </option>

                                <option value="Image">

                                    Image

                                </option>

                                <option value="Video">

                                    Video

                                </option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                File

                            </label>

                            <input type="file" class="form-control" id="galleryFile" name="file"
                                accept="image/*,video/*" required>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-4">

                            <img id="previewImage" class="img-fluid rounded shadow d-none">

                        </div>

                    </div>

                    <button class="btn blue mt-3">

                        <i class="bi bi-check-circle"></i>

                        Upload

                    </button>

                    <button type="reset" class="btn btn-warning mt-3">

                        Reset

                    </button>

                </form>

            </div>

        </div>

        <!-- Gallery Table -->

        <div class="card shadow border-0 rounded-4">

            <div class="card-header d-flex justify-content-between align-items-center">

                <h5 class="mb-0">

                    Gallery Files

                </h5>

                <input type="text" id="searchGallery" class="form-control w-25" placeholder="Search">

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead>

                            <tr>

                                <th>#</th>

                                <th>File Type</th>

                                <th>Preview</th>

                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr>

                                <td>1</td>

                                <td>

                                    <span class="badge bg-success">

                                        Image

                                    </span>

                                </td>

                                <td>

                                    <img src="/uploads/sample.jpg" class="gallery-thumb">

                                </td>

                                <td>

                                    <button class="btn btn-warning btn-sm">

                                        <i class="bi bi-pencil"></i>

                                    </button>

                                    <button class="btn btn-danger btn-sm">

                                        <i class="bi bi-trash"></i>

                                    </button>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <footer class="text-center mt-5 text-muted">

            © 2026 Foundation Management System

        </footer>
</div>
</div>
    </div>

    <script src="/js/gallery.js"></script>
    <script src="/components/sidebar.js"></script>
</body>

</html>
