<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Events Master</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/event.css">

</head>

<body>
    <div id="sidebar-container"></div>

    <div class="container py-4">

        <!-- Add Event -->

        <div class="card shadow border-0 rounded-4 mb-4">

            <div class="card-header">

                <h5 class="mb-0">

                    <i class="bi bi-plus-circle-fill"></i>

                    Add Event

                </h5>

            </div>

            <div class="card-body">

                <form id="eventForm">

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Image

                            </label>

                            <input type="file" id="eventImage" name="image" class="form-control" accept="image/*">

                        </div>

                        <div class="col-md-6 text-center">

                            <img id="previewImage" class="img-fluid rounded shadow d-none" style="max-width:180px;">

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Title

                            </label>

                            <input type="text" id="title" class="form-control" placeholder="Enter Event Title" required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Date

                            </label>

                            <input type="date" id="date" class="form-control" required>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Time

                            </label>

                            <input type="time" id="time" class="form-control" required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Location

                            </label>

                            <input type="text" id="location" class="form-control" placeholder="Enter Location" required>

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Description

                        </label>

                        <textarea id="description" class="form-control" rows="4"
                            placeholder="Enter Event Description"></textarea>

                    </div>

                    <button type="submit" class="btn blue">

                        <i class="bi bi-save"></i>

                        Save Event

                    </button>

                    <button type="reset" class="btn btn-warning">

                        Reset

                    </button>

                </form>

            </div>

        </div>

        <!-- Manage Events -->

        <div class="card shadow border-0 rounded-4">

            <div class="card-header d-flex justify-content-between align-items-center">

                <h5 class="mb-0">

                    Manage Events

                </h5>

                <input type="text" id="searchEvent" class="form-control w-25" placeholder="Search">

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead>

                            <tr>

                                <th>No</th>

                                <th>Image</th>

                                <th>Title</th>

                                <th>Date</th>

                                <th>Time</th>

                                <th>Location</th>

                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="eventTable">

                            <tr>

                                <td>1</td>

                                <td>

                                    <img src="/images/default-event.jpg" class="event-image">

                                </td>

                                <td>Monthly Camp</td>

                                <td>2026-07-25</td>

                                <td>10:00 AM</td>

                                <td>Balotra</td>

                                <td>

                                    <button class="btn btn-warning btn-sm" onclick=`editEvent(${event.id})`>

                                        <i class="bi bi-pencil-fill"></i>

                                    </button>

                                    <button class="btn btn-danger btn-sm">

                                        <i class="bi bi-trash-fill"></i>

                                    </button>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <footer class="text-center mt-5 text-muted">

            © 2026 Purbiya Balika Foundation. All Rights Reserved.

        </footer>
</div>
</div>
    </div>

    <script src="/js/events.js"></script>
    <script src="/components/sidebar.js"></script>

</body>

</html>
