<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Team Master</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="/css/team.css">

</head>

<body>
<div id="sidebar-container"></div>
    <div class="container py-4">
        <!-- Add Member -->

        <div class="card shadow border-0 rounded-4 mb-4">

            <div class="card-header text-white">

                <h5 class="mb-0">

                    <i class="bi bi-person-plus-fill"></i>

                    Add Member

                </h5>

            </div>

            <div class="card-body">

                <form id="teamForm" action="/team/add" method="POST" enctype="multipart/form-data">

                    <div class="row">


                        <div class="col-md-4 mb-3">

                            <label class="form-label">

                                Profile Image

                            </label>

                            <input type="file" id="profileImage" name="profile" class="form-control" accept="image/*">

                        </div>

                        <div class="col-md-6">

                            <img id="previewImage" class="img-fluid rounded shadow d-none" style="max-width:180px;">

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Name

                            </label>

                            <input type="text" name="name" class="form-control" placeholder="Enter member name">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Designation

                            </label>

                            <input type="text" name="designation" class="form-control" placeholder="Enter designation">

                        </div>

                    </div>

                    <button class="btn blue">

                        <i class="bi bi-check-circle"></i>

                        Save Member

                    </button>

                    <button type="reset" class="btn btn-warning">

                        Reset

                    </button>

                </form>

            </div>

        </div>

        <!-- Member List -->

        <div class="card shadow border-0 rounded-4">

            <div class="card-header d-flex justify-content-between align-items-center">

                <h5 class="mb-0">

                    Manage Members

                </h5>

                <input type="text" id="searchMember" class="form-control w-25" placeholder="Search Member">

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead>

                            <tr>

                                <th>ID</th>

                                <th>Image</th>

                                <th>Name</th>

                                <th>Designation</th>

                                <th>Order</th>

                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr>

                                <td>1</td>

                                <td>

                                    <img src="/uploads/user.png" class="team-image">

                                </td>

                                <td>

                                    Pira Ram

                                </td>

                                <td>

                                    Director

                                </td>

                                <td>

                                    1

                                </td>

                                <td>

                                    <button class="btn btn-warning btn-sm">

                                        <i class="bi bi-pencil-fill"></i>

                                    </button>

                                    <button class="btn btn-danger btn-sm">

                                        <i class="bi bi-trash-fill"></i>

                                    </button>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <footer class="text-center mt-5 text-muted">

            © 2026 Foundation Management System

        </footer>
</div>
</div>
    </div>

    <script src="/js/team.js"></script>
<script src="/components/sidebar.js"></script>
</body>

</html>
